[Service]
# Fedora's fprintd.service ships DevicePolicy=auto with an allow-list for
# USB/SPI/hidraw only. A device-cgroup denial surfaces as EPERM, which is what
# made the EL721 driver fail with "cannot open the QTEE object namespace".
# The EgisTec EL721 driver needs the QTEE side of the stack.
DeviceAllow=/dev/tee0 rw
DeviceAllow=/dev/spcom rw
DeviceAllow=/dev/qsee_ipc_irq_spss rw
DeviceAllow=/dev/dma_heap/qcom,secure-sp-tz rw
DeviceAllow=/dev/esfp0 rw
DeviceAllow=/dev/k250a rw
# The driver persists gatekeeper state outside /var/lib/fprint, which
# ProtectSystem=strict would otherwise mount read-only.
ReadWritePaths=/var/lib/gts9u-fingerprint
