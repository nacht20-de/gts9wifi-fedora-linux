# Turn a silent hang into a panic, so ramoops keeps the kernel log of it in
# /sys/fs/pstore and panic=10 reboots the tablet.  docs/Hardware-Notes.md
# ("Kernel logs after a crash") says where the records end up.
#
# A CPU stuck with preemption or interrupts off stalls RCU.  Panic on the first
# stall warning (21 s) instead of repeating the warning every few minutes.
kernel.panic_on_rcu_stall = 1

# Samsung ABL appends nowatchdog to the command line, which switches the soft
# and hard (buddy) lockup detectors off at boot.  Switch them back on, print
# every CPU's backtrace and panic when one fires.  A kernel built without the
# detectors has none of these keys; systemd-sysctl skips them.
kernel.watchdog = 1
kernel.softlockup_all_cpu_backtrace = 1
kernel.hardlockup_all_cpu_backtrace = 1
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
